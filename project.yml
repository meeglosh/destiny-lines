name: DestinyLines
options:
  bundleIdPrefix: com.kenzoragames
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # XcodeGen can't put the StoreKit config on the scheme's TestAction; see the script.
  postGenCommand: ./Scripts/patch-scheme-storekit.sh

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  DestinyLines:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DestinyLines
    resources:
      - path: DestinyLines/Resources
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: DestinyLines/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "Destiny Lines needs your camera to photograph your palm for a reading."
        NSPhotoLibraryUsageDescription: "Choose an existing photo of your palm from your library."
        NSPhotoLibraryAddUsageDescription: "Save your reading's share card to your photo library."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Rye-Regular.ttf
          - AlegreyaSans-Regular.ttf
          - AlegreyaSans-Medium.ttf
          - AlegreyaSans-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kenzoragames.Destiny-Lines
        PRODUCT_NAME: DestinyLines
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "11"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: 7K9WY5T49S
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - DestinyLinesTests
        - DestinyLinesUITests
      gatherCoverageData: true
      # Local StoreKit config so purchases are testable in the simulator. Switching to the
      # real App Store means removing this line only — no code changes (CLAUDE.md §7.8).
      storeKitConfiguration: DestinyLines/Resources/Products.storekit

  DestinyLinesUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DestinyLinesUITests
    dependencies:
      - target: DestinyLines
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kenzoragames.Destiny-Lines.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DestinyLines

  DestinyLinesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DestinyLinesTests
    dependencies:
      - target: DestinyLines
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kenzoragames.Destiny-Lines.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
